[project]
name = "screengloss"
version = "1.1.0"
description = "Portable Windows screen translation and learner's dictionary"
requires-python = ">=3.11,<3.12"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"app/ui/*" = ["N802"]
